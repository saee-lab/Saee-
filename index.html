<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chatbot UI</title>
    <style>
      :root {
        --bg-1: #0f172a;
        --bg-2: #111827;
        --panel: rgba(15, 23, 42, 0.9);
        --panel-2: rgba(30, 41, 59, 0.8);
        --primary: #7c3aed;
        --primary-2: #22c55e;
        --bot-bubble: #1f2937;
        --user-bubble: linear-gradient(135deg, #8b5cf6, #6366f1);
        --text: #e5e7eb;
        --muted: #94a3b8;
        --shadow: rgba(15, 23, 42, 0.5);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
        color: var(--text);
      }

      .chat-shell {
        width: min(92vw, 980px);
        height: min(86vh, 760px);
        background: var(--panel);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 25px 60px var(--shadow);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 22px;
        background: rgba(17, 24, 39, 0.9);
        border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--primary), #3b82f6);
        font-weight: bold;
      }

      .status {
        font-size: 0.78rem;
        color: var(--primary-2);
      }

      .status-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--primary-2);
        margin-right: 6px;
        box-shadow: 0 0 12px rgba(34, 197, 94, 0.9);
      }

      .chat-body {
        height: calc(100% - 170px);
        padding: 22px 20px 14px;
        overflow-y: auto;
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.8));
      }

      .messages {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .message-row {
        display: flex;
      }

      .message-row.user {
        justify-content: flex-end;
      }

      .bubble {
        max-width: 75%;
        padding: 14px 16px;
        border-radius: 18px;
        line-height: 1.5;
        font-size: 0.97rem;
        word-wrap: break-word;
      }

      .message-row.bot .bubble {
        background: var(--bot-bubble);
        border-top-left-radius: 6px;
      }

      .message-row.user .bubble {
        background: var(--user-bubble);
        border-top-right-radius: 6px;
      }

      .composer {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px 20px 20px;
        background: rgba(15, 23, 42, 0.88);
        border-top: 1px solid rgba(148, 163, 184, 0.12);
      }

      .input-wrap {
        flex: 1;
        display: flex;
        align-items: center;
        background: var(--panel-2);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 16px;
        padding: 0 14px;
      }

      input[type="text"] {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-size: 1rem;
        padding: 16px 8px;
      }

      input::placeholder {
        color: var(--muted);
      }

      button {
        border: none;
        border-radius: 14px;
        padding: 14px 22px;
        color: white;
        font-weight: 700;
        cursor: pointer;
        background: linear-gradient(135deg, var(--primary), #2563eb);
        transition: transform 0.18s ease, opacity 0.18s ease;
      }

      button:hover {
        transform: translateY(-1px);
        opacity: 0.96;
      }

      @media (max-width: 640px) {
        .chat-shell {
          width: 100vw;
          height: 100vh;
          border-radius: 0;
        }

        .bubble {
          max-width: 85%;
        }
      }
    </style>
  </head>
  <body>
    <div class="chat-shell">
      <div class="topbar">
        <div class="brand">
          <div class="avatar">AI</div>
          <div>
            <strong>Saee Assistant</strong><br />
            <span class="status"><span class="status-dot"></span>Online</span>
          </div>
        </div>
      </div>

      <div class="chat-body">
        <div class="messages" id="messages">
          <div class="message-row bot">
            <div class="bubble">Hello! I’m your AI chatbot. Ask me anything.</div>
          </div>
          <div class="message-row user">
            <div class="bubble">Hi! Can you help with my project?</div>
          </div>
          <div class="message-row bot">
            <div class="bubble">Absolutely! I can help with ideas, coding, writing, and more.</div>
          </div>
        </div>
      </div>

      <form class="composer" id="chat-form">
        <div class="input-wrap">
          <input id="chat-input" type="text" placeholder="Type your message..." autocomplete="off" />
        </div>
        <button type="submit">Send</button>
      </form>
    </div>

    <script>
      const form = document.getElementById('chat-form');
      const input = document.getElementById('chat-input');
      const messages = document.getElementById('messages');

      const botReplies = [
        'That sounds great. Tell me more about what you want to build.',
        'I can help with that. Let’s break it into simple steps.',
        'Nice idea! I can support you with planning, coding, or content.',
        'I’m here to help. Share the details and I’ll guide you.'
      ];

      function addMessage(text, sender) {
        const row = document.createElement('div');
        row.className = 'message-row ' + sender;

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;

        row.appendChild(bubble);
        messages.appendChild(row);
        messages.parentElement.scrollTop = messages.parentElement.scrollHeight;
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        const value = input.value.trim();

        if (!value) {
          return;
        }

        addMessage(value, 'user');
        input.value = '';

        const reply = botReplies[Math.floor(Math.random() * botReplies.length)];
        setTimeout(() => {
          addMessage(reply, 'bot');
        }, 350);
      });
    </script>
  </body>
</html>
