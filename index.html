<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Node.js HTML Server</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }

      .card {
        background: white;
        padding: 2rem 3rem;
        border-radius: 12px;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
        text-align: center;
      }

      h1 {
        color: #1f2937;
        margin-bottom: 0.5rem;
      }

      p {
        color: #4b5563;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Hello from Node.js!</h1>
      <p>Your HTML page is being served successfully.</p>
    </div>
  </body>
</html>
